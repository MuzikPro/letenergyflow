<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)" />
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Let Energy Flow — an offline, local-first trainer for memorising TCM meridians and acupoints. Educational use only."
    />
    <!-- Link-preview card. Unfurlers need absolute URLs; the image is the same
         1280x640 card used for the GitHub social preview (docs/social-card.png). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Let Energy Flow" />
    <meta property="og:title" content="Let Energy Flow · 炁流" />
    <meta
      property="og:description"
      content="A provenance-first atlas for memorising the meridian system — 362 acupoints, 14 channels + 奇經八脈, 26-day curriculum. Educational only, offline, open source."
    />
    <meta property="og:url" content="https://letenergyflow.app/" />
    <meta property="og:image" content="https://letenergyflow.app/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Let Energy Flow — 炁流 — the meridian atlas figure beside the app name and repo URL"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Let Energy Flow · 炁流" />
    <meta
      name="twitter:description"
      content="A provenance-first atlas for memorising the meridian system — educational only, offline, open source."
    />
    <meta name="twitter:image" content="https://letenergyflow.app/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Let Energy Flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
