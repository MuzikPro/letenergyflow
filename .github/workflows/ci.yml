name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, tests, landmark audit, shared build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json requires ^20.19.0 || >=22.12.0; pin a version that
      # satisfies it rather than whatever the runner image happens to default to.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Skips here are expected: a few suites in src/data/indications.test.ts
      # verify strings against private course worksheets that are not in this
      # repository and skip when absent. A run reporting skips is healthy.
      - name: Test
        run: npm test

      # Zero drift on every cun-stated point is the acceptance bar.
      - name: Landmark audit
        run: npx tsx scripts/audit-landmarks.ts --all

      # The shared build's leak verifier fails if any model-written string
      # survives into the artifact, so a leak fails CI instead of shipping.
      - name: Shared build + leak verifier
        run: npm run build:shared
